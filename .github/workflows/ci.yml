name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # Test-only values; no real service is contacted in CI.
  JWT_SECRET: ci-only-jwt-secret-0123456789abcdefghijklmn
  COOKIE_SECRET: ci-only-cookie-secret-0123456789abcdefghij
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  backend:
    name: Backend · lint, build, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # `prisma generate` reads the config but never connects.
      DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm run test:cov -- --ci
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: ignore
          retention-days: 7

  backend-system:
    name: Backend · migrations and system tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cognify
          POSTGRES_PASSWORD: cognify
          POSTGRES_DB: cognify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cognify -d cognify_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cognify:cognify@localhost:5432/cognify_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Apply migrations to an empty database
        run: npx prisma migrate deploy
      - name: Check schema.prisma matches the migrations
        # The HNSW index lives only in SQL (Prisma cannot model it), so it is
        # the one expected difference.
        run: |
          drift=$(npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --script \
            | grep -vE '^\s*$|^--|^Loaded|MaterialChunk_embedding_idx' || true)
          if [ -n "$drift" ]; then
            echo "::error::schema.prisma has changes no migration creates. Add a migration."
            echo "$drift"
            exit 1
          fi
      - name: System tests
        run: npm run test:system -- --ci

  frontend:
    name: Frontend · lint, type-check, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: End-to-end · Playwright
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cognify
          POSTGRES_PASSWORD: cognify
          POSTGRES_DB: cognify_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cognify -d cognify_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cognify:cognify@localhost:5432/cognify_e2e
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix e2e
      - name: Prepare the database
        working-directory: backend
        run: |
          npx prisma generate
          npx prisma migrate deploy
      - name: Build the API
        run: npm run build --prefix backend
      - name: Build the web app
        run: npm run build --prefix frontend
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        working-directory: e2e
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
